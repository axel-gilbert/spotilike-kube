version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: todolist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - todolist-postgres-data:/var/lib/postgresql/data
    networks:
      - todolist-network
    restart: on-failure

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/todolist"
      SECRET_KEY: "dev_secret_key_not_for_production"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - todolist-network
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - todolist-network
    restart: on-failure

volumes:
  todolist-postgres-data:

networks:
  todolist-network:
    driver: bridge

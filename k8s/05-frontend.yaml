apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: todolist
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: harbor.kakor.ovh/ipim2il/groupe-2/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
# Service ClusterIP : le frontend est exposé vers l'extérieur via la Route, pas directement.
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: todolist
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
# Route OpenShift : objet spécifique OpenShift qui remplace l'Ingress standard.
# Crée automatiquement une URL HTTPS publique sur le domaine du cluster.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend
  namespace: todolist
spec:
  host: todolist-groupe-2.apps.openshift.kakor.ovh
  to:
    kind: Service
    name: frontend-service
    weight: 100
  port:
    targetPort: 3000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

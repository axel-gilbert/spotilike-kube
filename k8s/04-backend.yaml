# Deployment: Kubernetes maintient toujours 2 replicas du backend en vie.
# Si un pod crash, k8s en recrée un automatiquement.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: todolist
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: todolist-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: todolist-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: todolist-secrets
                  key: jwt-secret-key
            - name: ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: todolist-config
                  key: ALGORITHM
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: todolist-config
                  key: ACCESS_TOKEN_EXPIRE_MINUTES
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
# Service ClusterIP: donne une adresse DNS stable au backend.
# Le frontend l'atteint via "backend-service:8000".
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: todolist
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
